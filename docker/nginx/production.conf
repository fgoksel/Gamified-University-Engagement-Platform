# Production: Nginx ends the TLS connection (Technical Specification 5.2.1, 8.2).
# Used by docker-compose.prod.yml. Put the certificate in docker/nginx/certs/
# as fullchain.pem and the private key as privkey.pem (see README).

# Every request on plain HTTP is sent to HTTPS.
server {
    listen 80;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    index index.php index.html;
    root /var/www/html/public;

    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Browsers only use HTTPS for this site for the next year.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # fastcgi_params passes HTTPS=on to PHP on this server, so Laravel builds
    # https:// links and sends the session cookie as Secure.
    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}
