# Local development: plain HTTP on http://localhost:8081.
# HTTPS and HSTS are only used in production, see production.conf.
#
# Phone demos (Task #88): browsers give the camera only to https pages, so a phone needs an
# https address. `docker compose --profile demo up -d tunnel` puts one in front of this
# server. The tunnel ends the TLS connection and says so in X-Forwarded-Proto; passing that
# on as HTTPS makes Laravel build https:// links and assets for that request only.
map $http_x_forwarded_proto $forwarded_https {
    default "";
    https   on;
}

server {
    listen 80;
    index index.php index.html;
    root /var/www/html/public;

    include /etc/nginx/security-headers.conf;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTPS $forwarded_https if_not_empty;
    }
}
