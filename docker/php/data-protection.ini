; Task #62 (GDPR). docker-compose.yml mounts this file into the PHP containers that run the
; application (app, queue and scheduler).
;
; A stack trace in a log, in the failed jobs table or on an error page lists the arguments of every
; call. Without this setting PHP writes the first 15 characters of each text argument into it, and
; that can be the start of a name or of an e-mail address. With it the trace names the calls and
; shows no values.
zend.exception_ignore_args = On
