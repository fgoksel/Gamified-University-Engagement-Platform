services:
  app:
    build:
      context: ./docker/php
    container_name: gup-app
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DB_HOST=db
      - REDIS_HOST=redis
      - MAIL_HOST=mailpit

  webserver:
    image: nginx:alpine
    container_name: gup-nginx
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  vite:
    build:
      context: ./docker/php
    container_name: gup-vite
    working_dir: /var/www/html
    # Install inside the container so Linux builds of native tools are used,
    # whatever OS the project folder was first installed on.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"

  db:
    image: mysql:8
    container_name: gup-mysql
    environment:
      MYSQL_DATABASE: gup
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: gup_user
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:alpine
    container_name: gup-redis

  mailpit:
    image: axllent/mailpit
    container_name: gup-mailpit
    ports:
      - "8025:8025"  # web UI to view "sent" emails
      - "1025:1025"  # SMTP port your app sends to

volumes:
  db_data:
